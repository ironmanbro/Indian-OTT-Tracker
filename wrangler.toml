# Cloudflare Workers (static assets + API). Deploy with:  npx wrangler deploy
# The Worker name must match your Cloudflare project name (Workers & Pages → project name).
name = "indian-ott-tracker"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# `wrangler deploy` builds the site first, so no separate build command is needed in the dashboard.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

# Secrets (TMDB_API_KEY) are NOT stored here: Settings → Variables and Secrets, or .dev.vars locally.

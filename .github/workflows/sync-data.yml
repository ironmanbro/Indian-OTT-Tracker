name: Refresh data

# Rebuilds public/india_movies.json from IMDb's free datasets (no API key needed)
# and commits it if it changed. Cloudflare then redeploys from the new commit.
on:
  schedule:
    - cron: "17 2 * * 1" # weekly (Mon), 02:17 UTC (≈ 07:47 IST)
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to commit the refreshed file

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build india_movies.json (keyless, IMDb datasets)
        run: python scripts/build_imdb_catalog.py --dir "$RUNNER_TEMP/imdb"

      - name: Sanity-check output (never overwrite good data with a bad run)
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("public/india_movies.json", encoding="utf-8"))
          movies = d["movies"]
          rated = sum(1 for m in movies if m.get("imdb_rating"))
          print(f"{len(movies)} movies, {rated} with IMDb ratings")
          if len(movies) < 1000:
              sys.exit("Too few movies - refusing to commit.")
          if rated < len(movies) * 0.9:
              sys.exit("IMDb ratings join looks broken - refusing to commit.")
          PY

      - name: Commit if changed
        run: |
          # "generated_at" changes every run, so compare the movie data only
          python - <<'PY' > changed.txt
          import json, subprocess
          new = json.load(open("public/india_movies.json", encoding="utf-8"))["movies"]
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:public/india_movies.json"]))["movies"]
          except Exception:
              old = None
          print("yes" if new != old else "no")
          PY
          if [ "$(cat changed.txt)" = "yes" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/india_movies.json
            git commit -m "chore(data): weekly refresh of india_movies.json"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No data changes - nothing to commit."
          fi

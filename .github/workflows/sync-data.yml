name: Refresh data

# Rebuilds public/india_movies.json (TMDB catalog + India streaming availability + IMDb ratings)
# and commits it if it changed. Cloudflare then redeploys from the new commit.
on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC (≈ 07:47 IST)
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to commit the refreshed file

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check TMDB key is configured
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Add a repository secret named TMDB_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Build india_movies.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/sync_india_movies.py --top 1000 --delay 0.1

      - name: Sanity-check output (never overwrite good data with a bad run)
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("public/india_movies.json", encoding="utf-8"))
          movies = d["movies"]
          rated = sum(1 for m in movies if m.get("imdb_rating"))
          print(f"{len(movies)} movies, {rated} with IMDb ratings")
          if len(movies) < 50:
              sys.exit("Too few movies - refusing to commit.")
          if rated < len(movies) * 0.3:
              sys.exit("IMDb ratings join looks broken - refusing to commit.")
          PY

      - name: Commit if changed
        run: |
          # "generated_at" changes every run, so compare the movie data only
          python - <<'PY' > changed.txt
          import json, subprocess
          new = json.load(open("public/india_movies.json", encoding="utf-8"))["movies"]
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:public/india_movies.json"]))["movies"]
          except Exception:
              old = None
          print("yes" if new != old else "no")
          PY
          if [ "$(cat changed.txt)" = "yes" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/india_movies.json
            git commit -m "chore(data): daily refresh of india_movies.json"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No data changes - nothing to commit."
          fi
